<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#191c19" />
    <title>Invenit: o Xadrez Evolutivo</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Invenit: o Xadrez Evolutivo</h1>
        <p>vita viam invenit</p>
      </div>
      <button id="menu-button" aria-haspopup="dialog" aria-label="Abrir menu">
        <span class="menu-icon" aria-hidden="true">☰</span>
        <span class="menu-label">Menu</span>
      </button>
    </header>
    <main>
      <section class="play-area" aria-label="Partida">
        <div class="turn-strip">
          <strong id="turn" aria-live="polite"></strong><span id="round"></span>
        </div>
        <div id="event" class="event"></div>
        <div
          id="mobile-selected-summary"
          class="mobile-selected-summary"
          aria-label="Resumo da peça selecionada"
          hidden
        ></div>
        <div
          id="board"
          class="board"
          aria-label="Tabuleiro de xadrez evolutivo"
        ></div>
        <div class="board-footer">
          <div id="board-legend" class="terrain-key" aria-label="Legenda contextual do tabuleiro"></div>
          <button id="pass">Passar vez</button>
        </div>
        <p id="message" role="status"></p>
      </section>
      <button
        id="undo-neocortex"
        class="neocortex-undo"
        aria-label="Desfazer cenário previsto pelo Neocórtex Desenvolvido"
        title="Desfazer sua ação e a resposta adversária"
        hidden
      >↻</button>
      <aside>
        <section class="panel">
          <h2>Peça selecionada</h2>
          <div id="selected">
            Selecione uma peça para ver suas características.
          </div>
        </section>
      </aside>
    </main>
    <dialog id="vivify-dialog" aria-labelledby="vivify-title">
      <h2 id="vivify-title">Vivificar</h2>
      <p id="vivify-copy">Escolha a ação biológica.</p>
      <div id="vivify-options" class="dialog-actions"></div>
      <button id="vivify-cancel">Cancelar</button>
    </dialog>
    <dialog id="notice-dialog" aria-labelledby="notice-title">
      <h2 id="notice-title"></h2>
      <div id="notice-content"></div>
      <button id="notice-ok" autofocus>Continuar</button>
    </dialog>
    <dialog id="game-over-dialog" aria-labelledby="game-over-title">
      <h2 id="game-over-title">Fim da partida</h2>
      <div id="game-over-body"></div>
      <div class="dialog-actions">
        <button id="game-over-board">Ver tabuleiro</button>
        <button id="game-over-new" class="primary">Encerrar ciclo</button>
      </div>
    </dialog>
    <dialog
      id="mass-extinction-dialog"
      aria-labelledby="mass-extinction-title"
    >
      <h2 id="mass-extinction-title">Extinção em Massa</h2>
      <p id="mass-extinction-copy">Só os mais adaptados sobrevivem.</p>
      <button id="mass-extinction-continue" class="primary" autofocus>
        Continuar
      </button>
    </dialog>
    <dialog id="menu-dialog" aria-labelledby="menu-title">
      <h2 id="menu-title">Sua partida</h2>
      <label
        >Cenário<select id="scenario">
          <option value="earth">Vida na Terra</option>
          <option value="alternative">Cenários Alternativos</option>
          <option value="arena">Arena</option>
        </select></label
      ><label
        >Modo<select id="mode">
          <option value="multi">2 jogadores</option>
          <option value="single">Contra o computador</option>
          <option value="auto">Computador × computador</option>
        </select></label
      ><label
        >Dificuldade<select id="difficulty">
          <option value="easy">Fácil</option>
          <option value="medium">Médio</option>
          <option value="hard">Difícil</option>
        </select></label
      >
      <div class="menu-actions">
        <button id="save">Salvar partida</button
        ><button id="import">Importar arquivo</button
        ><button id="rules">Como jogar</button
        ><button id="evolution-history">História evolutiva</button
        ><button id="discoveries">Descobertas <span id="discoveries-badge" class="unread-badge" hidden></span></button
        ><button id="game-log">Log da partida</button
        ><button id="new">Nova partida</button>
      </div>
      <input
        id="import-file"
        type="file"
        accept="application/json,.json"
        hidden
      /><button id="menu-close" class="primary">Voltar ao jogo</button>
    </dialog>
    <dialog id="arena-dialog" aria-labelledby="arena-title">
      <h2 id="arena-title">Arena</h2>
      <p id="arena-copy"></p>
      <p id="arena-status" class="arena-status"></p>
      <div class="arena-lineages">
        <section>
          <h3>Linhagem A <span id="arena-primary-count"></span></h3>
          <div id="arena-primary" class="arena-trait-grid"></div>
        </section>
        <section>
          <h3>Linhagem B <span id="arena-companion-count"></span></h3>
          <div id="arena-companion" class="arena-trait-grid"></div>
        </section>
      </div>
      <div class="dialog-actions">
        <button id="arena-randomize" type="button">Sortear</button>
        <button id="arena-cancel" type="button">Cancelar</button>
        <button id="arena-confirm" type="button" class="primary">Confirmar</button>
      </div>
    </dialog>
    <dialog id="discoveries-dialog" aria-labelledby="discoveries-title">
      <h2 id="discoveries-title">Descobertas</h2>
      <div class="discovery-tabs" role="tablist" aria-label="Categorias de descobertas">
        <button type="button" role="tab" data-discovery-tab="geology">Eras <span id="discoveries-geology-badge" class="unread-badge" hidden></span></button>
        <button type="button" role="tab" data-discovery-tab="events">Eventos <span id="discoveries-events-badge" class="unread-badge" hidden></span></button>
        <button type="button" role="tab" data-discovery-tab="mutations">Mutações <span id="discoveries-mutations-badge" class="unread-badge" hidden></span></button>
      </div>
      <div id="discovery-list" class="discovery-list"></div>
      <article id="discovery-detail" class="discovery-detail" hidden>
        <button id="discovery-back" type="button" class="discovery-back">← Voltar</button>
        <h3 id="discovery-detail-title"></h3>
        <img id="discovery-detail-image" alt="" />
        <p id="discovery-detail-text"></p>
        <div class="discovery-actions">
          <a id="discovery-wikipedia" class="wikipedia-link" target="_blank" rel="noopener noreferrer">Wikipedia</a>
          <button id="discovery-play" type="button" class="primary" hidden>Jogar</button>
        </div>
      </article>
      <button id="discoveries-close" class="primary">Voltar ao menu</button>
    </dialog>
    <dialog id="info-dialog" aria-labelledby="info-title" tabindex="-1">
      <h2 id="info-title"></h2>
      <div id="info-content"></div>
      <div class="dialog-actions">
        <button id="info-cancel" hidden>Cancelar</button
        ><button id="info-ok">Entendi</button>
      </div>
    </dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
