<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#191c19" />
    <title>Xadrez Evolutivo</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Xadrez Evolutivo</h1>
        <p>Sobreviva. Reproduza. Evolua.</p>
      </div>
      <button id="menu-button" aria-haspopup="dialog">☰ Menu</button>
    </header>
    <main>
      <section class="play-area" aria-label="Partida">
        <div class="turn-strip">
          <strong id="turn" aria-live="polite"></strong><span id="round"></span>
        </div>
        <div id="event" class="event"></div>
        <div
          id="board"
          class="board"
          aria-label="Tabuleiro de xadrez evolutivo"
        ></div>
        <div class="board-footer">
          <div class="terrain-key" aria-label="Legenda do terreno">
            <span>🟩 Casa fértil</span><span>🟥 Casa hostil</span><span>☠️ Decomposição</span>
          </div>
          <button id="pass">Passar vez</button>
        </div>
        <p id="message" role="status"></p>
      </section>
      <aside>
        <section class="panel">
          <h2>Peça selecionada</h2>
          <div id="selected">
            Selecione uma peça para ver suas características.
          </div>
        </section>
        <section class="panel">
          <h2>Mutações em jogo</h2>
          <div id="traits"></div>
        </section>
      </aside>
    </main>
    <dialog id="notice-dialog" aria-labelledby="notice-title">
      <h2 id="notice-title"></h2>
      <div id="notice-content"></div>
      <button id="notice-ok" autofocus>Continuar</button>
    </dialog>
    <dialog id="game-over-dialog" aria-labelledby="game-over-title">
      <h2 id="game-over-title">Fim da partida</h2>
      <div id="game-over-body"></div>
      <div class="dialog-actions">
        <button id="game-over-board">Ver tabuleiro</button>
        <button id="game-over-new" class="primary">Nova partida</button>
      </div>
    </dialog>
    <dialog id="menu-dialog" aria-labelledby="menu-title">
      <h2 id="menu-title">Sua partida</h2>
      <label
        >Modo<select id="mode">
          <option value="multi">2 jogadores</option>
          <option value="single">Contra o computador</option>
        </select></label
      ><label
        >Dificuldade<select id="difficulty">
          <option value="easy">Fácil</option>
          <option value="medium">Médio</option>
          <option value="hard">Difícil</option>
        </select></label
      >
      <div class="menu-actions">
        <button id="save">Salvar partida</button
        ><button id="import">Importar arquivo</button
        ><button id="rules">Como jogar</button
        ><button id="new">Nova partida</button>
      </div>
      <input
        id="import-file"
        type="file"
        accept="application/json,.json"
        hidden
      /><button id="menu-close" class="primary">Voltar ao jogo</button>
    </dialog>
    <dialog id="info-dialog" aria-labelledby="info-title">
      <h2 id="info-title"></h2>
      <div id="info-content"></div>
      <div class="dialog-actions">
        <button id="info-cancel" hidden>Cancelar</button
        ><button id="info-ok">Entendi</button>
      </div>
    </dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
