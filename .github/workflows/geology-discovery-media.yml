name: Refresh geology discovery media

on:
  push:
    branches:
      - feature/geology-discovery-content-media
    paths:
      - scripts/build-geology-discovery-media.mjs
      - src/discoveries.js
      - .github/workflows/geology-discovery-media.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geology-discovery-content-media
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-geology-discovery-media.mjs
      - name: Commit researched Wikipedia/Wikimedia geology media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geology-discovery-media.js assets/discoveries/geology
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add researched geology discovery media"
          git push
