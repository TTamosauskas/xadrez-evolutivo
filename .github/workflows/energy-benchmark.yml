name: Temporary energy benchmarks
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/energy-benchmark.yml"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Energy smoke simulation
        continue-on-error: true
        run: GAMES=8 GOAL_TURNS=200 TURN_LIMIT=300 npm run simulate
      - name: Energy period smoke
        continue-on-error: true
        run: GAMES_PER_STAGE=1 GOAL_TURNS=200 TURN_LIMIT=300 npm run benchmark:periods
      - name: Energy stall diagnostics
        continue-on-error: true
        run: DIAGNOSTIC_GAMES=2 GOAL_TURNS=200 DIAGNOSTIC_TURN_LIMIT=300 node scripts/stall-diagnostics.js
