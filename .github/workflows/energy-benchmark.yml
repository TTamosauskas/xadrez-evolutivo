name: Temporary energy benchmarks
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/energy-benchmark.yml"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: HEAD core simulation
        continue-on-error: true
        run: GAMES=24 GOAL_TURNS=200 TURN_LIMIT=300 npm run simulate
      - name: HEAD period benchmark
        continue-on-error: true
        run: GAMES_PER_STAGE=2 GOAL_TURNS=200 TURN_LIMIT=300 npm run benchmark:periods
      - name: HEAD stall diagnostics
        continue-on-error: true
        run: DIAGNOSTIC_GAMES=4 GOAL_TURNS=200 DIAGNOSTIC_TURN_LIMIT=300 node scripts/stall-diagnostics.js
      - name: MAIN core simulation
        continue-on-error: true
        run: |
          git worktree add /tmp/xadrez-main origin/main
          cd /tmp/xadrez-main
          npm ci
          GAMES=24 GOAL_TURNS=200 TURN_LIMIT=300 npm run simulate
