name: P0 strategic simulation validation
on:
  push:
    branches:
      - feature/p0-clareza-estrategica-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Simulate 50 full games
        run: npm run simulate
        env:
          GAMES: '50'
          GOAL_TURNS: '200'
