name: Test and deploy to Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test
      - name: Simulate representative games
        id: simulate
        continue-on-error: true
        run: npm run simulate
        env:
          GAMES: 50
          GOAL_TURNS: 200
          TURN_LIMIT: 300
      - name: Benchmark all geological periods
        id: period_benchmark
        continue-on-error: true
        run: npm run benchmark:periods
        env:
          GAMES_PER_STAGE: 6
          GOAL_TURNS: 200
          TURN_LIMIT: 300
      - name: Diagnose Ediacaran Silurian Devonian stalls
        id: stall_diagnostics
        continue-on-error: true
        run: node scripts/stall-diagnostics.js
        env:
          DIAGNOSTIC_GAMES: 24
          GOAL_TURNS: 200
          DIAGNOSTIC_TURN_LIMIT: 300
          DIAGNOSTIC_TAIL: 100
      - name: Enforce simulation envelope
        if: steps.unit_tests.outcome == 'failure' || steps.simulate.outcome == 'failure' || steps.period_benchmark.outcome == 'failure' || steps.stall_diagnostics.outcome == 'failure'
        run: exit 1
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
