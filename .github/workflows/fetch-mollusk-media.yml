name: Fetch Mollusk discovery media

on:
  push:
    branches:
      - polish-mollusk-discoveries

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download curated Commons media
        run: |
          mkdir -p fetched-media
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Mollusca_Diversity.png/1280px-Mollusca_Diversity.png" -o fetched-media/molusco.png
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/SEM_images_of_radulae_of_the_oblong_rocksnail_%28Leptoxis_compacta%29_as_collected_in_1881_and_2011.png/1280px-SEM_images_of_radulae_of_the_oblong_rocksnail_%28Leptoxis_compacta%29_as_collected_in_1881_and_2011.png" -o fetched-media/radula.png
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/b/be/Mussel_%26_Byssal_Threads.jpg" -o fetched-media/bisso.jpg
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/NautilusCutawayLogarithmicSpiral.jpg/1280px-NautilusCutawayLogarithmicSpiral.jpg" -o fetched-media/concha.jpg
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Humbolt_squid_tentacles_and_beak.jpg/1280px-Humbolt_squid_tentacles_and_beak.jpg" -o fetched-media/ventosas.jpg
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/1/12/PZSL1907Plate20.png" -o fetched-media/regeneracao-source.png
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Cuttlefish_eye_closeup.JPG/1280px-Cuttlefish_eye_closeup.JPG" -o fetched-media/visao.jpg
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Loligo_vulgaris_with_captured_Sparus_aurata.jpeg/1280px-Loligo_vulgaris_with_captured_Sparus_aurata.jpeg" -o fetched-media/tentaculo.jpg
          curl -L --fail --retry 4 "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Camouflage_octopus.jpg/1280px-Camouflage_octopus.jpg" -o fetched-media/cromatoforos.jpg
      - name: Prepare horizontal regeneration crop
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("fetched-media/regeneracao-source.png")
          im = Image.open(p).convert("RGB")
          w, h = im.size
          top = im.crop((0, 0, w, int(h * 0.42)))
          target_ratio = 1.5
          tw, th = top.size
          if tw / th < target_ratio:
              new_h = int(tw / target_ratio)
              y0 = max(0, (th - new_h) // 2)
              top = top.crop((0, y0, tw, y0 + new_h))
          else:
              new_w = int(th * target_ratio)
              x0 = max(0, (tw - new_w) // 2)
              top = top.crop((x0, 0, x0 + new_w, th))
          top.thumbnail((1200, 800), Image.Resampling.LANCZOS)
          top.save("fetched-media/regeneracao.jpg", quality=92, optimize=True)
          p.unlink()
          PY
      - name: Verify landscape dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path("fetched-media").iterdir():
              im = Image.open(p)
              w, h = im.size
              print(p.name, w, h, round(w/h, 2))
              assert w >= 900 and h >= 420 and w/h >= 1.2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mollusk-discovery-media
          path: fetched-media
          if-no-files-found: error
